# ---------------------------------------------------------------------------------------
# E. CONTROL
# ---------------------------------------------------------------------------------------
script:
  # Write one signed setpoint (+W charge, -W discharge, 0 idle) with the integration's register set
  aecc_battery_write_setpoint:
    alias: "AECC Battery: write power setpoint"
    mode: queued
    fields:
      power: {description: "Watts: + charge, - discharge, 0 idle", example: 500}
    sequence:
      - variables:
          max_charge: "{{ states('input_number.aecc_battery_max_charge_power') | int(800) }}"
          max_discharge: "{{ states('input_number.aecc_battery_max_discharge_power') | int(800) }}"
          max_soc: "{{ states('input_number.aecc_battery_charge_stop_soc') | int(98) }}"
          min_soc: "{{ states('input_number.aecc_battery_discharge_stop_soc') | int(10) }}"
          f6: "{{ states('input_number.aecc_battery_slot_field6') | int(5) }}"
          p: "{{ power | int(0) }}"
          # clamp to the configured limits, then flip sign for register 3003 (negative = charge)
          reg_power: >-
            {% if p > 0 %}{{ 0 - ([p, max_charge] | min) }}
            {%- elif p < 0 %}{{ [0 - p, max_discharge] | min }}
            {%- else %}0{% endif %}
          slot: >-
            {% if reg_power | int == 0 %}0,00:00,00:00,0,0,0,0,0,0,{{ max_soc }},{{ min_soc }}
            {%- else %}1,00:00,23:59,{{ reg_power }},0,6,{{ f6 }},0,0,{{ max_soc }},{{ min_soc }}
            {%- endif %}
          regs: >-
            {% set r = {"3000":"1","3020":"6","3021":"0","3022":"0","3030":"1","3003": slot} %}
            {% set feed = [max_charge, max_discharge] | max %}
            {% if feed > 800 %}{% set r = dict(r, **{"3039": feed | string}) %}{% endif %}
            {{ r | to_json }}
      - action: shell_command.aecc_set_registers
        data:
          registers: "{{ regs }}"
        response_variable: w
        continue_on_error: true
      - delay: {milliseconds: 700}
      # Write-back verification (like the integration): re-read 3003 and compare with what was sent
      - action: shell_command.aecc_get_registers
        response_variable: v
        continue_on_error: true
      - variables:
          write_ok: "{{ w is defined and w.returncode == 0 }}"
          read_ok: "{{ v is defined and v.returncode == 0 }}"
          actual_slot: "{{ ((v.stdout | from_json)['3003'] | default('?')) if read_ok else '?' }}"
          verified: "{{ read_ok and (actual_slot == slot) }}"
      - event: aecc_battery_refresh_registers
      - if:
          - condition: template
            value_template: "{{ not write_ok or not verified }}"
        then:
          - action: system_log.write
            data:
              level: warning
              logger: aecc_battery
              message: >-
                Setpoint write {{ 'FAILED' if not write_ok else 'NOT CONFIRMED' }}: sent 3003={{ slot }},
                battery reports 3003={{ actual_slot }} ({{ (w.stderr | default('')) if w is defined else 'no response' }})
          - action: persistent_notification.create
            data:
              notification_id: aecc_battery_write
              title: "AECC battery: setpoint not confirmed"
              message: >-
                Requested {{ p }} W (register 3003 = {{ slot }}), battery reports {{ actual_slot }}.
                {{ 'The write itself failed: ' ~ (w.stderr | default('')) if not write_ok else 'Check the AECC app / On Grid Output / slot field 6.' }}
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: aecc_battery_write

  # Translate HBC's outputs (helpers) into one setpoint
  aecc_battery_apply_hbc_control:
    alias: "AECC Battery: apply HBC control (Marstek M1)"
    mode: restart
    sequence:
      - delay: {milliseconds: 500}
      - variables:
          ctrl: "{{ states('input_select.marstek_m1_rs485_control_mode_helper') }}"
          mode: "{{ states('input_select.marstek_m1_forcible_charge_discharge_helper') }}"
          p_charge: "{{ states('input_number.marstek_m1_forcible_charge_power_helper') | int(0) }}"
          p_discharge: "{{ states('input_number.marstek_m1_forcible_discharge_power_helper') | int(0) }}"
          setpoint: >-
            {% if ctrl == 'enable' and mode == 'charge' %}{{ p_charge }}
            {%- elif ctrl == 'enable' and mode == 'discharge' %}{{ 0 - p_discharge }}
            {%- else %}0{% endif %}
      - action: script.aecc_battery_write_setpoint
        data:
          power: "{{ setpoint | int }}"

automation:
  - id: aecc_battery_hbc_control
    alias: "AECC Battery: apply HBC control"
    description: >-
      Fires when HBC changes control mode, forcible charge/discharge or power on the
      Marstek M1 entities and writes the resulting setpoint to the AECC battery.
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_select.marstek_m1_rs485_control_mode_helper
          - input_select.marstek_m1_forcible_charge_discharge_helper
          - input_number.marstek_m1_forcible_charge_power_helper
          - input_number.marstek_m1_forcible_discharge_power_helper
    actions:
      - action: script.aecc_battery_apply_hbc_control

  # Re-apply the HBC setpoint after a HA restart
  - id: aecc_battery_reapply_on_start
    alias: "AECC Battery: re-apply HBC control after start"
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: {seconds: 60}
      - action: script.aecc_battery_apply_hbc_control